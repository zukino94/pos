openapi: 3.0.3
info:
  title: POS API
  description: API for POS (Point of Sale) system.
  version: 1.0.0
servers:
  - url: http://localhost:8080
tags:
  - name: Auth
    description: Authentication endpoints

paths:

  /api/login:
    post:
      tags:
        - Auth
      summary: Login and get access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: admin
              password: secret123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                user:
                  id: 1
                  username: admin
                  name: Administrator
                  role: admin
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBadRequest'
              example:
                message: Username atau password salah
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInternalServer'
              example:
                reference: ajsajshjdgdeydgvdydvwdywvdywdv
                message: Internal Server Error
  
