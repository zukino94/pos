components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          example: admin
        password:
          type: string
          minLength: 6
          format: password
          example: secret123

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT access token
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: admin
        name:
          type: string
          example: Administrator
        role:
          type: string
          enum:
            - admin
            - cashier
          example: admin

    ErrorBadRequest:
      type: object
      properties:
        message:
          type: string
          example: Username atau password salah

    ErrorInternalServer:
      type: object
      properties:
        reference:
          type: string
          example: hdkshdksdhwkdhskdhsdkshd
        message:
          type: string
          example: Internal Server Error
